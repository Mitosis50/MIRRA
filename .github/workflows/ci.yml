name: MIRRA verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust components
        run: rustup show
      - name: Python reference and vectors
        run: |
          python3 -m unittest discover -s verification -p 'test_release_controls.py'
          python3 verification/p1/exp_q32_production.py
          python3 verification/generate_vectors.py --check
          cd tests && sha256sum --check vectors.sha256
      - name: Rust tests and lint
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Dependency audit and reproducible SBOMs
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          bash scripts/security-check.sh
      - name: Build Wasm and verify Candid
        run: |
          bash scripts/build-wasm.sh
          cargo install candid-extractor --version 0.1.6 --locked
          bash scripts/verify-candid.sh
      - name: PocketIC authorization and upgrade
        env:
          MIRRA_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/mirra_canister.wasm
        run: cargo test --manifest-path integration-tests/Cargo.toml --locked --test upgrade -- --nocapture
