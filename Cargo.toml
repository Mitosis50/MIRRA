[package]
name = "mirra_canister"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic correction-weighting canister for ICP"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "=0.10.35"
hex = "=0.4.3"
ic-cdk = "=0.17.2"
ic-stable-structures = "=0.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.151"

[profile.release]
lto = true
opt-level = "z"
overflow-checks = true
codegen-units = 1
panic = "abort"
strip = "symbols"

